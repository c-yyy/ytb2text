<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>视频转文字助手</title>
    <link rel="stylesheet" href="./sidepanel.css" />
  </head>
  <body>
    <header class="hd">
      <div class="hd-title">
        <span class="logo">V2T</span>
        <div>
          <h1>视频转文字助手</h1>
          <p>Whisper 本地推理 · 不上传 · 0 API 成本</p>
        </div>
      </div>
      <div class="hd-badge" id="runtimeBadge" title="当前推理后端">未加载</div>
    </header>

    <main>
      <!-- 音频来源 -->
      <section class="card">
        <h2>1 · 选择音频来源</h2>
        <div class="sources">
          <button class="src-btn" data-src="tab">
            <span class="ico">●</span>
            <span class="lbl">录制当前标签页</span>
            <span class="sub">边播边录，通用</span>
          </button>
          <button class="src-btn" data-src="file">
            <span class="ico">▲</span>
            <span class="lbl">本地音视频文件</span>
            <span class="sub">最稳定</span>
          </button>
          <button class="src-btn" data-src="page">
            <span class="ico">▶</span>
            <span class="lbl">页面内视频</span>
            <span class="sub">免录制 / 取字幕</span>
          </button>
        </div>

        <p class="hint" id="sourceHint">
          首次使用会下载一次模型（之后缓存在本地，完全离线可跑）。
        </p>

        <!-- 录制中面板 -->
        <div class="panel" id="recPanel" hidden>
          <div class="rec-row">
            <span class="rec-dot"></span>
            <span id="recTimer">00:00</span>
            <span class="rec-tip">正在录制标签页声音，保持视频播放</span>
          </div>
          <button class="btn danger" id="stopRecBtn">停止并开始转录</button>
        </div>

        <!-- 页面内视频面板 -->
        <div class="panel" id="pagePanel" hidden>
          <div id="pageMediaList" class="list"></div>
          <div id="pageCaptionList" class="list"></div>
        </div>

        <input type="file" id="fileInput" accept="audio/*,video/*" hidden />
      </section>

      <!-- 设置 -->
      <section class="card">
        <h2>2 · 设置</h2>
        <label class="field">
          <span>模型</span>
          <select id="modelSelect"></select>
        </label>
        <p class="hint small" id="modelHint"></p>

        <div class="row2">
          <label class="field">
            <span>语言</span>
            <select id="langSelect"></select>
          </label>
          <label class="field">
            <span>运行设备</span>
            <select id="deviceSelect"></select>
          </label>
        </div>

        <label class="field">
          <span>模型下载源</span>
          <select id="mirrorSelect"></select>
        </label>

        <label class="check">
          <input type="checkbox" id="translateChk" />
          <span>翻译成英文（task=translate）</span>
        </label>
        <label class="check">
          <input type="checkbox" id="filterChk" checked />
          <span>过滤静音 / 幻觉片段</span>
        </label>
        <button class="btn ghost full" id="preloadBtn">预加载模型</button>
      </section>

      <!-- 进度 -->
      <section class="card" id="progressCard" hidden>
        <h2>进度</h2>
        <div class="bar"><div class="bar-fill" id="barFill"></div></div>
        <p class="hint" id="progressText">准备中…</p>
        <p class="hint small mono" id="progressDetail"></p>
        <button class="btn ghost full" id="cancelBtn">取消</button>
      </section>

      <!-- 结果 -->
      <section class="card" id="resultCard" hidden>
        <h2>
          结果
          <span class="seg-tabs">
            <button class="seg on" data-view="plain">纯文本</button>
            <button class="seg" data-view="time">带时间轴</button>
          </span>
        </h2>
        <div class="result" id="resultBox"></div>
        <div class="btn-row">
          <button class="btn" id="copyBtn">复制</button>
          <button class="btn" id="txtBtn">TXT</button>
          <button class="btn" id="srtBtn">SRT</button>
          <button class="btn" id="vttBtn">VTT</button>
        </div>
        <p class="hint small" id="resultMeta"></p>
      </section>

      <footer class="ft">
        音频与模型都在本机处理，不经过任何服务器。
      </footer>
    </main>

    <script type="module" src="./sidepanel.js"></script>
  </body>
</html>
